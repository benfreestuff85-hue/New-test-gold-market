services:
  - type: web
    name: kalshi-gold-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: KALSHI_USE_DEMO
        value: "true"
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: KALSHI_KEY_ID
        sync: false
      - key: KALSHI_PRIVATE_KEY
        sync: false
